<!doctype html>
<html><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
  // SPA fallback for GitHub Pages: stash the URL and bounce to the app root.
  var segs = location.pathname.split('/').filter(Boolean);
  var repoSegs = 1; // project site: /<repo>/...  (set to 0 for custom domain / root site)
  var base = '/' + segs.slice(0, repoSegs).join('/') + '/';
  sessionStorage.redirect = location.href;
  location.replace(location.origin + base);
</script></head><body></body></html>
