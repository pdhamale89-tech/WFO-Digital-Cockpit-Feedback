<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WFO Digital Cockpit | Feedback &amp; Validation</title>
    <script>
      // GitHub Pages SPA fallback: restore path saved by 404.html
      (function(l){var p=sessionStorage.redirect;delete sessionStorage.redirect;if(p&&p!==l.href){history.replaceState(null,null,p);}})(window.location);
      try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
